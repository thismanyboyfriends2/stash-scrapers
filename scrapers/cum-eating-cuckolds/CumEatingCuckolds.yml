name: Cum Eating Cuckolds
sceneByURL:
  - action: scrapeXPath
    url:
      - cumeatingcuckolds.com/tour/updates/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      # scoped to the VideoObject block: the page also carries Organization/WebSite/
      # BreadcrumbList ld+json blocks that would otherwise collide on shared keys like "name"
      $script: //script[@type="application/ld+json" and contains(text(),'"@type":"VideoObject"')]
    scene:
      Title:
        selector: $script
        postProcess:
          - replace:
              - regex: '(?s).+?"name":"([^"]+)".+'
                with: $1
      Details:
        selector: //p[@class="blurb"]
      Date:
        selector: $script
        postProcess:
          - replace:
              - regex: '(?s).+?"uploadDate":"([^"]+)".+'
                with: $1
          - parseDate: "2006-01-02T15:04:05-07:00"
      Image:
        selector: //div[@class="preview-media"]/img/@data-alt
      Performers:
        Name:
          selector: $script
          postProcess:
            - replace:
                # isolate the actor array's contents, then strip JSON syntax down to
                # a __SEP__-joined name list for `split` below
                - regex: '(?s).*"actor":\[(.*?)\].*'
                  with: $1
                - regex: '\{"@type":"Person","name":"'
                  with: ""
                - regex: '","url":"[^"]*"\},?'
                  with: __SEP__
                - regex: __SEP__$
                  with: ""
          split: __SEP__
      Studio:
        Name:
          fixed: Cum Eating Cuckolds
      URL:
        selector: //html/head/meta[@property="og:url"]/@content
      Code:
        selector: //html/head/meta[@property="og:url"]/@content
        postProcess:
          - replace:
              - regex: '.+/(\d+)$'
                with: $1
